<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabFlow — Adaptive Vocabulary Assistant</title>
    <meta name="description" content="Personal Adaptive Vocabulary Assistant">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="logo-area">
            <h1><a href="{{ url_for('main.home') }}" class="logo-link">VocabFlow</a></h1>
            <span class="tagline">Personal Vocabulary Assistant</span>
        </div>
        <nav class="nav-links">
            <a href="{{ url_for('main.home') }}" class="nav-item">📝 Analyze</a>
            <a href="{{ url_for('main.vocabulary_page') }}" class="nav-item">📚 My Vocabulary</a>
        </nav>
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% endblock %}
</body>
</html>
